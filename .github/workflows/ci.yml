name: CI

# Runs on every push and pull request:
# - backend tests, on SQLite and again on a real Postgres
# - frontend lint, unit tests and build
# - end-to-end tests: real browsers playing solo, daily and a two-player timed room
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quizzr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests (SQLite)
        run: python -m pytest backend -q
      - name: Run daily-challenge tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quizzr_test
        run: python -m pytest backend/tests/test_daily.py -q

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: my-react-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: my-react-app/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r ../backend/requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Keep the trace of any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: my-react-app/test-results/
          retention-days: 7
